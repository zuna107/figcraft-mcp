[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "figcraft-mcp"
version = "1.0.0"
description = "Universal Live-Streaming MCP Server & Anti-Slop UI Design Engine for FigCraft Desktop"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "FigCraft MCP Contributors" }
]
keywords = ["mcp", "model-context-protocol", "figcraft", "ui-design", "anti-slop-ui", "figma", "agent-skill"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = []

[project.scripts]
figcraft-mcp = "figcraft_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

