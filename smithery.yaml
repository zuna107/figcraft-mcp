# Smithery MCP Registry configuration (https://smithery.ai)
startCommand:
  type: stdio
  configSchema:
    type: object
    properties:
      port:
        type: number
        default: 7979
        description: TCP control port for attaching to the live FigCraft Desktop instance
      streamSteps:
        type: boolean
        default: true
        description: Enable high-speed step-by-step live cursor streaming on the user's canvas
      streamDelayMs:
        type: number
        default: 40
        description: Delay in milliseconds between streamed creation steps (default 40ms)
      defaultDocument:
        type: string
        description: Optional path to a .figcraft file to auto-open when launching FigCraft Desktop
  commandFunction:
    |-
    (config) => ({
      command: 'python',
      args: ['-m', 'figcraft_mcp.server'],
      env: {
        FIGCRAFT_PORT: String(config.port ?? 7979),
        FIGCRAFT_STREAM_STEPS: (config.streamSteps ?? true) ? '1' : '0',
        FIGCRAFT_STREAM_DELAY_MS: String(config.streamDelayMs ?? 40),
        ...(config.defaultDocument ? { FIGCRAFT_DEFAULT_DOC: config.defaultDocument } : {})
      }
    })

